<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Meus Livros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .book-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .book-cover {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 80px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .book-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.1) 75%, transparent 75%, transparent);
            background-size: 40px 40px;
            animation: shimmer 3s infinite;
        }

        .book-cover-text {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .book-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .book-year {
            font-size: 12px;
            color: #999;
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            margin-top: auto;
            width: fit-content;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 40px;
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        .error-message {
            background: rgba(255, 59, 48, 0.9);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            animation: slideDown 0.3s ease-out;
        }

        .error-message strong {
            display: block;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .empty-state h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }

            .book-cover {
                height: 240px;
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Minha Biblioteca</h1>
            <p>Gerenciador de livros moderno e elegante</p>
        </div>

        <div id="content"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/books';

        async function loadBooks() {
            const content = document.getElementById('content');

            try {
                content.innerHTML = `
                    <div class="loading">
                        <div class="loader"></div>
                        <p style="margin-top: 20px;">Carregando livros...</p>
                    </div>
                `;

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`Erro: ${response.status} ${response.statusText}`);
                }

                const books = await response.json();

                if (!Array.isArray(books) || books.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <h2>Nenhum livro encontrado</h2>
                            <p>Comece a adicionar livros à sua biblioteca!</p>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = `<div class="books-grid">${books.map(book => createBookCard(book)).join('')}</div>`;

            } catch (error) {
                console.error('Erro ao carregar livros:', error);
                content.innerHTML = `
                    <div class="error-message">
                        <strong>⚠️ Erro ao carregar os livros</strong>
                        <p>${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px; opacity: 0.8;">Certifique-se de que o servidor está rodando em http://localhost:3000</p>
                    </div>
                    <div class="empty-state">
                        <h2>Servidor indisponível</h2>
                        <p>Por favor, inicie o servidor e tente novamente</p>
                    </div>
                `;
            }
        }

        function createBookCard(book) {
            const initials = (book.title || 'L')
                .split(' ')
                .slice(0, 2)
                .map(w => w[0])
                .join('')
                .toUpperCase();

            const colors = [
                '#667eea',
                '#764ba2',
                '#f093fb',
                '#4facfe',
                '#00f2fe',
                '#43e97b',
                '#fa709a',
                '#fee140'
            ];

            const colorIndex = (book.id || book.title || '').charCodeAt(0) % colors.length;
            const color = colors[colorIndex];

            return `
                <div class="book-card">
                    <div class="book-cover" style="background: linear-gradient(135deg, ${color} 0%, ${adjustBrightness(color, -20)} 100%);">
                        <div class="book-cover-text">${initials}</div>
                    </div>
                    <div class="book-info">
                        <div>
                            <div class="book-title">${book.title || 'Título desconhecido'}</div>
                            <div class="book-author">👤 ${book.author || 'Autor desconhecido'}</div>
                        </div>
                        <div class="book-year">📅 ${book.year || 'Ano desconhecido'}</div>
                    </div>
                </div>
            `;
        }

        function adjustBrightness(color, percent) {
            const num = parseInt(color.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // Carregar livros quando a página for carregada
        document.addEventListener('DOMContentLoaded', loadBooks);

        // Recarregar a cada 5 segundos para sincronização em tempo real
        setInterval(loadBooks, 5000);
    </script>
</body>
</html>
